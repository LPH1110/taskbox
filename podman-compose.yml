services:
  db:
    image: postgres:16-alpine
    container_name: taskbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskbox_secret}
      POSTGRES_DB: ${POSTGRES_DB:-taskbox}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskbox} -d ${POSTGRES_DB:-taskbox}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: taskbox-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskbox}:${POSTGRES_PASSWORD:-taskbox_secret}@db:5432/${POSTGRES_DB:-taskbox}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_token_change_in_production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  pgdata:
